<!DOCTYPE html>
<html>
<head>
    <title>CMPRSS | High-Performance PDF Compression</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { --primary: #0070f3; --bg: #f8fafc; --text: #0f172a; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; background: var(--bg); color: var(--text); }
        .container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        h1 { margin-top: 0; letter-spacing: -1px; }
        .upload-box { border: 2px dashed #cbd5e1; padding: 30px; border-radius: 12px; margin: 20px 0; transition: border-color 0.2s; }
        .upload-box:hover { border-color: var(--primary); }
        button { background: #000; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: 500; }
        .download-btn { display: inline-block; background: var(--primary); color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; margin-top: 10px; font-weight: 600; }
        
        /* Progress System */
        .progress-wrap { display: none; width: 100%; max-width: 320px; height: 8px; margin: 20px auto 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-wrap.visible { display: block; }
        .progress-fill { height: 100%; width: 0%; background: var(--primary); border-radius: 10px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .progress-text { font-size: 0.9rem; color: #64748b; margin-top: 8px; }

        /* Animation for "Processing" state to signal life */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .processing-pulse { animation: pulse 1.5s infinite ease-in-out; color: var(--primary); font-weight: bold; }

        /* Psychological Support Block */
        .support-block { margin-top: 3rem; padding: 24px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .support-title { margin: 0 0 10px 0; color: #0f172a; font-size: 1.1rem; font-weight: 600; }
        .support-text { margin: 0 0 16px 0; color: #475569; font-size: 0.9rem; line-height: 1.5; }
        .btc-container { background: #f8fafc; padding: 14px; border-radius: 8px; border: 1px dashed #cbd5e1; }
        .btc-label { display: block; font-size: 0.7rem; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .btc-address { color: #0f172a; font-size: 0.85rem; word-break: break-all; font-weight: 600; font-family: ui-monospace, SFMono-Regular, monospace; user-select: all; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CMPRSS</h1>
        <p style="color: #64748b; margin-top: -10px; font-size: 0.9rem;">Private. Secure. Fast.</p>
        <div class="upload-box">
            <input type="file" id="fileInput" accept=".pdf" /><br><br>
            <button onclick="uploadFile()" id="btn">Compress PDF</button>
        </div>
        <div id="progress-wrap" class="progress-wrap">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-text" class="progress-text"></div>
        <div id="status"></div>
        
        <div class="support-block">
            <h3 class="support-title">Did this save you time?</h3>
            <p class="support-text">This tool is maintained by a solo developer. No ads, no tracking. If this helped you, consider supporting the server costs.</p>
            <div class="btc-container">
                <span class="btc-label">Bitcoin (BTC) Support Address</span>
                <code class="btc-address" title="Click to copy">bc1qvqqvl774t3hu0fnmr72lqv3dks3v3yhx3fsxzx</code>
            </div>
        </div>
    </div>

    <script>
        function getClientId() {
            let clientId = localStorage.getItem('cmprss_client_id');
            if (!clientId) {
                clientId = crypto.randomUUID ? crypto.randomUUID() : 'c-' + Date.now();
                localStorage.setItem('cmprss_client_id', clientId);
            }
            return clientId;
        }

        function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Please select a PDF file.");
            
            const MAX_FILE_SIZE = 50 * 1024 * 1024;
            if (file.size > MAX_FILE_SIZE) {
                document.getElementById('status').innerText = "Error: File exceeds 50MB limit.";
                return;
            }

            const formData = new FormData();
            formData.append("file", file);
            
            // UI Reset
            document.getElementById('status').innerHTML = "";
            document.getElementById('progress-wrap').classList.add('visible');
            document.getElementById('btn').disabled = true;
            
            const xhr = new XMLHttpRequest();
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progress-fill').style.width = (pct * 0.9) + '%'; // Reserve 10% for processing
                    document.getElementById('progress-text').innerText = `Uploading: ${pct}%`;
                }
            });

            xhr.addEventListener('load', () => {
                try {
                    const data = JSON.parse(xhr.responseText);
                    if (data.job_id) {
                        // Calculate an estimate: ~1 sec per MB as a baseline for Ghostscript
                        const estimateSec = Math.max(5, Math.round(file.size / (1024 * 1024) * 1.5));
                        pollStatus(data.job_id, estimateSec);
                    } else {
                        throw new Error(data.error || "Upload failed");
                    }
                } catch (e) {
                    resetUI(e.message);
                }
            });

            xhr.open('POST', '/upload');
            xhr.setRequestHeader('X-Client-ID', getClientId());
            xhr.send(formData);
        }

        function pollStatus(jobId, est) {
            let attempts = 0;
            const timer = setInterval(async () => {
                attempts++;
                try {
                    const res = await fetch(`/status/${encodeURIComponent(jobId)}`);
                    const data = await res.json();
                    const status = (data.status || '').toLowerCase();

                    if (status === 'done') {
                        clearInterval(timer);
                        finishUI(jobId);
                    } else if (status.includes('error')) {
                        clearInterval(timer);
                        resetUI(`Error: ${data.status}`);
                    } else {
                        // Keep user informed with a "Pulse" to show it's alive
                        document.getElementById('progress-text').innerHTML = 
                            `<span class="processing-pulse">Optimizing...</span> <br> <small>Est. remaining: ~${Math.max(1, est - (attempts * 1.5)).toFixed(0)}s</small>`;
                        document.getElementById('progress-fill').style.width = '95%';
                    }
                } catch (e) {
                    clearInterval(timer);
                    resetUI("Connection lost.");
                }
            }, 1500);
        }

        function finishUI(jobId) {
            document.getElementById('progress-wrap').classList.remove('visible');
            document.getElementById('progress-text').innerText = "Complete!";
            document.getElementById('status').innerHTML = `
                <div style="color: #16a34a; margin-bottom: 10px;">✓ PDF Compressed Successfully</div>
                <a class="download-btn" href="/?action=download&job_id=${encodeURIComponent(jobId)}" download="compressed.pdf">Download Results</a>
            `;
            document.getElementById('btn').disabled = false;
        }

        function resetUI(msg) {
            document.getElementById('progress-wrap').classList.remove('visible');
            document.getElementById('progress-text').innerText = "";
            document.getElementById('status').innerHTML = `<span style="color: #dc2626;">${msg}</span>`;
            document.getElementById('btn').disabled = false;
        }
    </script>
</body>
</html>
